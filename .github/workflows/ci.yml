jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "./megamind pizza app"

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test
